<!doctype html>
<html lang="en">
<head>
{% include head.html %}
{%- if page.external_url %}
<meta http-equiv="refresh" content="1; url={{ page.external_url }}">
{%- endif %}
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  <div class="cosmos" aria-hidden="true">
    <div class="nebula"></div>
    <canvas class="sky sky-far"></canvas>
    <canvas class="sky sky-near"></canvas>
  </div>
  {% include header.html %}
  <main id="main" class="container">
{{ content }}
  </main>
  {% include footer.html %}
  <script defer src="{{ '/assets/js/starfield.js' | relative_url }}"></script>
</body>
</html>
