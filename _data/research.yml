    - title: "Social Networks and the Propagation of Household Shocks to Asset Prices"
      url: https://arxiv.org/abs/2611.01540
      venue: "arXiv:2611.01540"
      date: "November 2026"
      featured: true
      links:
        - label: arXiv
          url: https://arxiv.org/abs/2611.01540
      abstract: >-
        When can local household disturbances move credit prices? I develop a
        financially weighted propagation operator on the social network. In a
        conditional household-intermediary equilibrium, its projection determines
        the household-demand component of the excess bond premium. Because
        responses decay at different rates across network patterns and channels,
        a location's relative financial importance generically changes with the
        horizon, so no single centrality measure summarizes exposure across
        horizons. Household measurements recover this projection exactly when
        they span independently measured demand sensitivities. Empirically,
        social exposure to storm-damaged counties is negatively associated with
        spending weeks later in counties outside the recorded footprints. In
        simulations on the observed network under the model's diffusion law, the
        operator predicts the propagated credit-premium component of held-out
        storms with about 30 percent less error than direct social exposure.

    - title: "That Time of the Year Again: Government Pay Revisions in the Aggregate Economy"
      url: https://arxiv.org/abs/2611.12565
      venue: "arXiv:2611.12565"
      date: "November 2026"
      featured: true
      links:
        - label: arXiv
          url: https://arxiv.org/abs/2611.12565
      abstract: >-
        Public pay is set by law in nominal terms, so inflation erodes its real
        value between legal acts until the government revises it. I model each
        revision as the choice of a forward-looking government, shaped by two
        costs that push in opposite directions. A fixed cost of acting makes
        revisions large and rare, whereas a convex cost of financing the increase
        at once makes them small and frequent. Through the budget, each revision
        also moves debt and the risk of fiscal stress under which the next one is
        made. In the documented pay decisions of eleven countries, pay set at
        discretion erodes against prices and private earnings and is restored in
        discrete steps, every cut was decided during market stress or an
        adjustment program, and court rulings drove a wedge between the cuts
        legislated, the cuts paid and the cuts that lasted. Estimated on the
        legal acts, the model reproduces the documented paths of pay in most
        countries when data and simulations are measured the same way. In
        Portugal's estimated model, the savings that the Treasury requires once
        spreads rise produce the cuts, the debt overhang holds pay down after the
        crisis, and a court that strikes cuts after they take effect invites cuts
        it will strike. Review of cuts before they took effect would have lowered
        the social cost of Portugal's crisis relative to review after the fact,
        and partial indexation would have paid in Bangladesh unless its automatic
        increases were costly to finance.

    - title: "Lights Out, Stress In: Assessing Stress Amidst Power and Energy Challenges in Bangladesh"
      url: https://arxiv.org/abs/2504.21541
      coauthors: Khondaker Golam Moazzem
      venue: "CPD Working Paper No. 156"
      date: "April 2025"
      links:
        - label: arXiv
          url: https://arxiv.org/abs/2504.21541
      abstract: >-
        This study examines the psychological impact of energy crises on
        households, utilising the Perceived Stress Scale-10 (PSS-10) to measure
        the stress induced by disruptions in electricity, gas, and fuel supply
        and pricing. Through a multivariate analysis incorporating Ordinary Least
        Squares (OLS) regression, Simultaneous-Quantile Regressions (SQR), Random
        Forest (RF) and Ordered Probit models, the research identifies the key
        socio-demographic and environmental factors influencing household stress.
        Our findings reveal that urban residency, low-income households, older
        individuals, and those with low environmental awareness are particularly
        vulnerable to stress during energy crises. Regional disparities and
        attitudes towards nuclear and renewable energy also significantly shape
        stress responses. The study emphasises the need for psychologically-informed
        energy policy, advocating for the inclusion of stress metrics in energy
        planning to enhance resilience and address the multi-dimensional nature
        of energy insecurity. This research contributes a novel, human-centric
        perspective to energy policy, urging policymakers to integrate
        psychosocial resilience alongside traditional technical and economic
        considerations in the design of energy interventions.

