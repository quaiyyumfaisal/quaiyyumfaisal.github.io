# Top navigation
nav:
  - title: About
    url: /
  - title: Research
    url: /research/
  - title: Notes
    url: /notes/

# ─────────────────────────────────────────────────────────────
#  Notes: every Markdown file in _notes/ becomes /notes/<file-name>/
# ─────────────────────────────────────────────────────────────
collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/og-image.jpg

# Markdown + code highlighting (GitHub Pages defaults, set explicitly)
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax   # lets you write $$x^2$$; rendered with KaTeX when a note sets `math: true`
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - .sass-cache
